body {

#gameArea {

.menu-title {

.character-selection {

<script>
let selectedCharacter = -1;

function selectCharacter(index) {
  selectedCharacter = index;
  document.querySelectorAll('.character-card').forEach((card, i) => {
    if (i === index) {
      card.classList.add('selected');
    } else {
      card.classList.remove('selected');
    }
  });
  document.getElementById('startBtn').disabled = false;
}

function startGame() {
  document.getElementById('menuScreen').style.display = 'none';
  game.player.form = selectedCharacter;
  updateFormDisplay();
  playBackgroundMusic();
  showLevelMessage('▶ LEVEL 1: JUNGLE START');
}

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

canvas.width = 1400;
canvas.height = 750;

const GRAVITY = 0.8;
const JUMP_STRENGTH = 16;
const MOVE_SPEED = 7;

let audioContext;
let isPlayingMusic = true;

function initAudio() {
  if (!audioContext) {
    audioContext = new (window.AudioContext || window.webkitAudioContext)();
  }
}

function playBackgroundMusic() {
  initAudio();
  
  // FUN JUNGLE ADVENTURE THEME - Catchy for kids!
  const melodySequence = [
    // Verse 1 - Happy bouncy theme
    { freq: 392, duration: 0.25 },  // G - start high
    { freq: 330, duration: 0.25 },  // E
    { freq: 392, duration: 0.25 },  // G (going up)
    { freq: 493, duration: 0.5 },   // B (higher, held)
    
    // Verse 2 - More playful
    { freq: 440, duration: 0.25 },  // A
    { freq: 392, duration: 0.25 },  // G
    { freq: 440, duration: 0.25 },  // A
    { freq: 523, duration: 0.5 },   // C (even higher!)
    
    // Verse 3 - Exciting drop
    { freq: 587, duration: 0.25 },  // D
    { freq: 523, duration: 0.25 },  // C
    { freq: 493, duration: 0.25 },  // B
    { freq: 440, duration: 0.5 },   // A
    
    // Verse 4 - Fun little fill
    { freq: 392, duration: 0.2 },   // G
    { freq: 440, duration: 0.2 },   // A
    { freq: 493, duration: 0.2 },   // B
    { freq: 523, duration: 0.4 },   // C (ending note)
  ];
  
  // Drum/Bass pulse - keep it simple and fun
  const bassSequence = [
    { freq: 196, duration: 0.6 },   // G (low) - BOOM
    { freq: 247, duration: 0.2 },   // B (low) - click
    { freq: 196, duration: 0.6 },   // G (low) - BOOM
    { freq: 165, duration: 0.4 },   // E (low) - bass
  ];
  
  let noteIndex = 0;
  let bassIndex = 0;
  
  // MELODY LINE - Bright and cheerful
  const melodyInterval = setInterval(() => {
    if (!isPlayingMusic || !game.gameRunning) {
      clearInterval(melodyInterval);
      return;
    }
    
    const note = melodySequence[noteIndex % melodySequence.length];
    
    const osc = audioContext.createOscillator();
    const gain = audioContext.createGain();
    
    osc.type = 'square'; // Brighter, more game-like
    osc.connect(gain);
    gain.connect(audioContext.destination);
    
    osc.frequency.value = note.freq;
    
    // Quick attack, smooth decay
    gain.gain.setValueAtTime(0, audioContext.currentTime);
    gain.gain.linearRampToValueAtTime(0.12, audioContext.currentTime + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + note.duration * 0.9);
    gain.gain.linearRampToValueAtTime(0, audioContext.currentTime + note.duration);
    
    osc.start(audioContext.currentTime);
    osc.stop(audioContext.currentTime + note.duration);
    
    noteIndex++;
  }, 300); // Upbeat tempo
  
  // BASS LINE - Deep, groovy beat
  const bassInterval = setInterval(() => {
    if (!isPlayingMusic || !game.gameRunning) {
      clearInterval(bassInterval);
      return;
    }
    
    const bass = bassSequence[bassIndex % bassSequence.length];
    
    const osc = audioContext.createOscillator();
    const gain = audioContext.createGain();
    
    osc.type = 'triangle'; // Warm bass
    osc.connect(gain);
    gain.connect(audioContext.destination);
    
    osc.frequency.value = bass.freq;
    
    // Punchy attack, quick release for beat feel
    gain.gain.setValueAtTime(0, audioContext.currentTime);
    gain.gain.linearRampToValueAtTime(0.15, audioContext.currentTime + 0.05);
    gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + bass.duration * 0.8);
    gain.gain.linearRampToValueAtTime(0, audioContext.currentTime + bass.duration);
    
    osc.start(audioContext.currentTime);
    osc.stop(audioContext.currentTime + bass.duration);
    
    bassIndex++;
  }, 400); // Steady bass beat
}

document.addEventListener('keydown', (e) => {
  game.keys[e.key.toLowerCase()] = true;
  if (e.key === ' ') { e.preventDefault(); attemptJump(); }
  if (e.key === '1') { game.player.form = 1; playTransform(); }
  if (e.key === '2') { game.player.form = 2; playTransform(); }
  if (e.key === '3') { game.player.form = 3; playTransform(); }
});

document.addEventListener('keyup', (e) => {
  game.keys[e.key.toLowerCase()] = false;
});

function attemptJump() { if (!game.player.isJumping) { game.player.velocityY = -JUMP_STRENGTH; game.player.isJumping = true; playJump(); } }

function createParticles(x, y, color, count) { for (let i = 0; i < count; i++) { game.particles.push({ x: x, y: y, vx: (Math.random() - 0.5) * 10, vy: Math.random() * 8 - 12, life: 60, color: color, size: Math.random() * 6 + 2 }); } }

function showLevelMessage(text) { const box = document.getElementById('levelBox'); box.textContent = text; box.style.display = 'block'; setTimeout(() => box.style.display = 'none', 2200); }

function showFallMessage() {

  setTimeout(() => {

function loseLife() { 
  console.log('loseLife called! Current lives:', game.lives, 'isProcessingFall:', game.isProcessingFall);
  if (game.isProcessingFall) {
    console.log('Already processing fall, returning');
    return;
  }
  game.isProcessingFall = true;
  
  game.lives--; 
  console.log('Lives reduced to:', game.lives);
  playLoseLife();
  updateLives();
  showFallMessage();  // Show "-1 LIFE!" message
  
  if (game.lives <= 0) { 
    console.log('Lives reached 0 - Game Over!');
    // All lives gone - GAME OVER
    setTimeout(() => { 
      gameOver(); 
    }, 1500);
  } else { 
    console.log('Respawning player...');
    // Still have lives - respawn at start
    setTimeout(() => {
      game.player.x = 100; 
      game.player.y = 500; 
      game.player.velocityY = 0; 
      updateFormDisplay(); 
      game.isProcessingFall = false;  // IMPORTANT: Reset flag after respawn
      console.log('Player respawned');
    }, 1500);
  } 
}

function updateLives() { for (let i = 1; i <= 3; i++) { const life = document.getElementById(`life${i}`); if (i <= game.lives) { life.style.display = 'block'; life.style.opacity = '1'; } else { life.style.display = 'none'; } } const livesText = document.getElementById('livesText'); if (game.lives === 1) { livesText.textContent = '1 LEFT'; } else if (game.lives === 2) { livesText.textContent = '2 LEFT'; } else if (game.lives === 3) { livesText.textContent = '3 LEFT'; } else { livesText.textContent = '0 LEFT'; } }

function updateBrickCounter() { document.getElementById('brickCount').textContent = game.bricksCollected; document.getElementById('brickTotal').textContent = game.totalBricks; }

function completeLevel() { const level = levels[game.level]; if (game.bricksCollected < game.totalBricks) { return; } game.gameRunning = false; playCrystal(); showLevelMessage(`✨ LEVEL ${game.level + 1} COMPLETE! ✨`); if (game.level < 7) { game.level++; setTimeout(() => { game.gameRunning = true; game.player.x = 100; game.player.y = 500; game.player.velocityY = 0; game.bricksCollected = 0; updateFormDisplay(); document.getElementById('level').textContent = game.level + 1; loadLevel(game.level); initBirds(); showLevelMessage(`▶ LEVEL ${game.level + 1}: ${levels[game.level].name.toUpperCase()}`); }, 2200); } else { gameWon(); } }

function gameWon() { game.gameRunning = false; document.getElementById('status').textContent = '🏆 WON!'; const box = document.getElementById('gameOverBox'); box.innerHTML = `🎉 ALL 8 LEVELS COMPLETE! 🎉<br><br>🏆 VICTORY 🏆<br><br>You saved the jungle!`; box.style.color = '#00FF00'; box.style.borderColor = '#00FF00'; box.style.display = 'block'; setTimeout(() => { document.getElementById('newGameBtn').style.display = 'block'; }, 2500); }

function loadLevel(levelNum) { const level = levels[levelNum]; game.bricksCollected = 0; game.totalBricks = level.platforms.filter(p => p !== level.platforms[0]).length; for (let p of level.platforms) { p.collected = false; } updateBrickCounter(); initBirds(); }

function update() {
  if (!game.gameRunning) return;
  game.time++; const level = levels[game.level];
  if (game.keys['arrowleft']) game.player.x -= MOVE_SPEED;
  if (game.keys['arrowright']) game.player.x += MOVE_SPEED;
  game.player.velocityY += GRAVITY; game.player.y += game.player.velocityY;
  if (game.player.x < 0) game.player.x = 0; if (game.player.x + game.player.width > 1400) game.player.x = 1400 - game.player.width;
  for (let p of level.platforms) {
    if (game.player.x + game.player.width > p.x && game.player.x < p.x + p.width && game.player.y + game.player.height >= p.y && game.player.y + game.player.height <= p.y + p.height + 10 && game.player.velocityY >= 0) {
      game.player.velocityY = 0; game.player.y = p.y - game.player.height; game.player.isJumping = false;
      if (p !== level.platforms[0] && !p.collected) { p.collected = true; game.bricksCollected++; updateBrickCounter(); createParticles(p.x + p.width / 2, p.y, '#00FF00', 10); }
    }
  }
  for (let enemy of level.enemies) { if (checkCollision(game.player, enemy)) { loseLife(); } }
  if (checkCollision(game.player, level.goal)) { completeLevel(); }
  
  // Check if player fell off screen (canvas height is 750)
  if (game.player.y > 750 && !game.isProcessingFall) { 
    console.log('FALL DETECTED! Player Y:', game.player.y);
    loseLife(); 
  }
  for (let p of game.particles) { p.x += p.vx; p.y += p.vy; p.vy += 0.3; p.life--; } game.particles = game.particles.filter(p => p.life > 0);
  
  // Update birds
  for (let bird of game.birds) {
    bird.x += bird.vx;
    bird.wingPhase += 0.15;
    if (bird.x > 1500) {
      bird.x = -50;
      bird.y = Math.random() * 300 + 50;
    }
  }
}

function checkCollision(rect1, rect2) { return rect1.x < rect2.x + rect2.width && rect1.x + rect1.width > rect2.x && rect1.y < rect2.y + rect2.height && rect1.y + rect1.height > rect2.y; }

function drawShifty(x, y, color) {
  ctx.fillStyle = color; ctx.shadowColor = color; ctx.shadowBlur = 20;
  ctx.beginPath(); ctx.arc(x, y, 22, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(255, 255, 255, 0.3)'; ctx.beginPath(); ctx.arc(x, y, 18, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'white'; ctx.beginPath(); ctx.arc(x - 8, y - 5, 6, 0, Math.PI * 2); ctx.fill(); ctx.beginPath(); ctx.arc(x + 8, y - 5, 6, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(x - 8, y - 5, 3, 0, Math.PI * 2); ctx.fill(); ctx.beginPath(); ctx.arc(x + 8, y - 5, 3, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(x, y + 5, 8, 0, Math.PI); ctx.stroke();
}

function drawTheme() {
  const level = levels[game.level];
  const theme = level.theme;
  
  if (theme === 'jungle') {
    ctx.strokeStyle = 'rgba(0, 200, 0, 0.3)'; ctx.lineWidth = 3;
    for (let i = 0; i < 5; i++) { ctx.beginPath(); ctx.moveTo(i * 280, 0); ctx.quadraticCurveTo(i * 280 + 100, 300, i * 280, 750); ctx.stroke(); }
    ctx.fillStyle = 'rgba(0, 150, 0, 0.4)';
    for (let i = 0; i < 4; i++) { ctx.beginPath(); ctx.arc(150 + i * 350, 100, 80, 0, Math.PI * 2); ctx.fill(); }
  } else if (theme === 'darkjungle') {
    ctx.strokeStyle = 'rgba(50, 100, 50, 0.4)'; ctx.lineWidth = 4;
    for (let i = 0; i < 6; i++) { ctx.beginPath(); ctx.moveTo(i * 230, 0); ctx.quadraticCurveTo(i * 230 + 80, 400, i * 230 + 50, 750); ctx.stroke(); }
  } else if (theme === 'river') {
    ctx.strokeStyle = 'rgba(100, 150, 255, 0.3)'; ctx.lineWidth = 2;
    for (let i = 0; i < 20; i++) { ctx.beginPath(); ctx.moveTo(0, 300 + Math.sin(game.time / 30 + i) * 20 + i * 20); ctx.lineTo(1400, 300 + Math.sin(game.time / 30 + i) * 20 + i * 20); ctx.stroke(); }
  } else if (theme === 'temple') {
    ctx.fillStyle = 'rgba(150, 120, 80, 0.4)';
    for (let i = 0; i < 6; i++) { ctx.fillRect(i * 230 + 50, 50, 50, 200); }
  } else if (theme === 'ruins') {
    ctx.strokeStyle = 'rgba(200, 150, 100, 0.3)'; ctx.lineWidth = 4;
    for (let i = 0; i < 5; i++) { ctx.beginPath(); ctx.moveTo(i * 280 + 100, 80); ctx.lineTo(i * 280 + 80, 300); ctx.stroke(); ctx.beginPath(); ctx.moveTo(i * 280 + 120, 100); ctx.lineTo(i * 280 + 140, 320); ctx.stroke(); }
  } else if (theme === 'swamp') {
    ctx.fillStyle = 'rgba(100, 150, 100, 0.2)';
    for (let i = 0; i < 15; i++) { const x = (game.time + i * 30) % 1400; const y = 400 + Math.sin(game.time / 20 + i) * 50; ctx.beginPath(); ctx.arc(x, y, 15 + Math.sin(i) * 8, 0, Math.PI * 2); ctx.fill(); }
  } else if (theme === 'ancientruins') {
    ctx.fillStyle = 'rgba(150, 150, 100, 0.3)';
    for (let i = 0; i < 4; i++) { for (let j = 0; j < 3; j++) { ctx.fillRect(i * 350 + 100, j * 200 + 50, 100, 100); ctx.strokeStyle = 'rgba(100, 100, 60, 0.5)'; ctx.lineWidth = 2; ctx.strokeRect(i * 350 + 100, j * 200 + 50, 100, 100); } }
  } else if (theme === 'crystalline') {
    ctx.fillStyle = 'rgba(100, 200, 255, 0.2)';
    for (let i = 0; i < 8; i++) { const x = (i * 175) + (game.time * 0.1) % 1400; ctx.beginPath(); ctx.arc(x, 150, 40, 0, Math.PI * 2); ctx.fill(); ctx.strokeStyle = 'rgba(100, 200, 255, 0.4)'; ctx.lineWidth = 2; ctx.stroke(); }
  }
}

function initBirds() {
  game.birds = [];
  for (let i = 0; i < 5; i++) {
    const types = ['sparrow', 'parrot', 'eagle', 'dove'];
    game.birds.push({
      x: Math.random() * 1400,
      y: Math.random() * 300 + 50,
      vx: Math.random() * 2 + 1,
      type: types[Math.floor(Math.random() * types.length)],
      wingPhase: Math.random() * Math.PI * 2
    });
  }
}

function drawBird(bird) {
  ctx.save();
  ctx.translate(bird.x, bird.y);
  
  // Add slight bob/wave motion as bird flies
  const bobAmount = Math.sin(bird.wingPhase * 0.5) * 1.5;
  ctx.translate(0, bobAmount);
  
  if (bird.type === 'sparrow') {
    // Realistic sparrow with flapping wings
    ctx.fillStyle = '#8B7355';
    ctx.beginPath();
    ctx.ellipse(0, 0, 11, 8, 0, 0, Math.PI * 2);
    ctx.fill();
    
    ctx.fillStyle = '#7A6347';
    ctx.beginPath();
    ctx.arc(7, -3, 5, 0, Math.PI * 2);
    ctx.fill();
    
    // Eye
    ctx.fillStyle = '#FFD700';
    ctx.beginPath();
    ctx.arc(9, -4, 1.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.arc(9.5, -4, 0.8, 0, Math.PI * 2);
    ctx.fill();
    
    // Beak
    ctx.fillStyle = '#8B7355';
    ctx.beginPath();
    ctx.moveTo(12, -3);
    ctx.lineTo(15, -2);
    ctx.lineTo(12, 0);
    ctx.closePath();
    ctx.fill();
    
    // ANIMATED WINGS - Flapping motion
    const wingFlap = Math.sin(bird.wingPhase) * 6;
    
    // Left wing
    ctx.fillStyle = '#654321';
    ctx.save();
    ctx.translate(-3, 0);
    ctx.rotate(wingFlap * 0.05);
    ctx.beginPath();
    ctx.ellipse(0, 0, 7, 4, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
    
    // Right wing
    ctx.fillStyle = '#654321';
    ctx.save();
    ctx.translate(3, 0);
    ctx.rotate(-wingFlap * 0.05);
    ctx.beginPath();
    ctx.ellipse(0, 0, 7, 4, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
    
    // Tail feathers
    ctx.fillStyle = '#5C4033';
    ctx.beginPath();
    ctx.moveTo(-10, -2);
    ctx.lineTo(-12, -3);
    ctx.lineTo(-12, 3);
    ctx.lineTo(-10, 2);
    ctx.closePath();
    ctx.fill();
    
  } else if (bird.type === 'parrot') {
    // Realistic parrot with animated wings
    ctx.fillStyle = '#FF6B35';
    ctx.beginPath();
    ctx.ellipse(0, 0, 13, 9, 0, 0, Math.PI * 2);
    ctx.fill();
    
    ctx.fillStyle = '#FF8C42';
    ctx.beginPath();
    ctx.ellipse(0, 1, 10, 7, 0, 0, Math.PI * 2);
    ctx.fill();
    
    // Green head
    ctx.fillStyle = '#228B22';
    ctx.beginPath();
    ctx.arc(10, -4, 6, 0, Math.PI * 2);
    ctx.fill();
    
    // Yellow cheek
    ctx.fillStyle = '#FFD700';
    ctx.beginPath();
    ctx.arc(8, -2, 2, 0, Math.PI * 2);
    ctx.fill();
    
    // Eye area white ring
    ctx.fillStyle = '#FFF8DC';
    ctx.beginPath();
    ctx.arc(12, -5, 2.5, 0, Math.PI * 2);
    ctx.fill();
    
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.arc(12, -5, 1.2, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#FFF';
    ctx.beginPath();
    ctx.arc(12.3, -5.3, 0.4, 0, Math.PI * 2);
    ctx.fill();
    
    // Beak (curved)
    ctx.fillStyle = '#333';
    ctx.beginPath();
    ctx.moveTo(15, -3);
    ctx.lineTo(19, -2);
    ctx.lineTo(15, 0);
    ctx.closePath();
    ctx.fill();
    
    // ANIMATED WINGS - Flapping
    const wingFlap = Math.sin(bird.wingPhase) * 8;
    
    // Left wing flapping
    ctx.fillStyle = '#FF4500';
    ctx.save();
    ctx.translate(-2, 0);
    ctx.rotate(wingFlap * 0.08);
    ctx.beginPath();
    ctx.ellipse(0, 0, 9, 5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
    
    // Right wing flapping
    ctx.fillStyle = '#FF4500';
    ctx.save();
    ctx.translate(2, 0);
    ctx.rotate(-wingFlap * 0.08);
    ctx.beginPath();
    ctx.ellipse(0, 0, 9, 5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
    
    // Tail
    ctx.fillStyle = '#DC143C';
    ctx.beginPath();
    ctx.moveTo(-11, -3);
    ctx.lineTo(-14, -5);
    ctx.lineTo(-14, 5);
    ctx.lineTo(-11, 3);
    ctx.closePath();
    ctx.fill();

    ctx.beginPath();
    ctx.arc(12, -5, 7, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#8B7355';
    ctx.beginPath();
    ctx.arc(8, -5, 6, 0, Math.PI * 2);
    ctx.fill();
    
    // Yellow eye ring
    ctx.fillStyle = '#FFD700';
    ctx.beginPath();
    ctx.arc(14, -6, 2.8, 0, Math.PI * 2);
    ctx.fill();
    
    // Black eye
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.arc(14, -6, 1.5, 0, Math.PI * 2);
    ctx.fill();

    ctx.beginPath();
    ctx.arc(14.5, -6.5, 0.5, 0, Math.PI * 2);

    ctx.beginPath();
    ctx.moveTo(19, -4);
    ctx.lineTo(24, -2);
    ctx.lineTo(19, 0);
    ctx.closePath();
    ctx.fill();
    
    // ANIMATED LARGE WINGS - Powerful flapping
    const wingFlap = Math.sin(bird.wingPhase) * 10;

    }

    ctx.rotate(-wingFlap * 0.1);

    ctx.lineWidth = 1;
    for (let i = 0; i <= 10; i += 2) {
      ctx.beginPath();
      ctx.moveTo(i, -5);
      ctx.lineTo(i + 1, -7);
      ctx.stroke();
    }
    ctx.restore();
    
    // Long tail
    ctx.fillStyle = '#5C4033';
    ctx.beginPath();
    ctx.moveTo(-13, -2);
    ctx.lineTo(-18, -4);
    ctx.lineTo(-18, 4);
    ctx.lineTo(-13, 2);
    ctx.closePath();
    ctx.fill();
    
  } else if (bird.type === 'dove') {
    // Realistic dove with gentle flapping
    ctx.fillStyle = '#D3D3D3';
    ctx.beginPath();
    ctx.ellipse(0, 0, 12, 8, 0, 0, Math.PI * 2);
    ctx.fill();
    
    // White breast
    ctx.fillStyle = '#F5F5F5';
    ctx.beginPath();
    ctx.ellipse(0, 1, 9, 6, 0, 0, Math.PI * 2);
    ctx.fill();
    
    // Gray head
    ctx.fillStyle = '#A9A9A9';
    ctx.beginPath();
    ctx.arc(9, -3, 5.5, 0, Math.PI * 2);
    ctx.fill();
    
    // Crown crest
    ctx.fillStyle = '#808080';
    ctx.beginPath();
    ctx.ellipse(9, -6, 3, 2, 0, 0, Math.PI * 2);
    ctx.fill();
    
    // Pink eye ring
    ctx.fillStyle = '#FFB6C1';
    ctx.beginPath();
    ctx.arc(11, -4, 1.8, 0, Math.PI * 2);
    ctx.fill();
    
    // Eye
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.arc(11, -4, 0.9, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#FFF';
    ctx.beginPath();
    ctx.arc(11.3, -4.3, 0.3, 0, Math.PI * 2);
    ctx.fill();
    
    // Beak
    ctx.fillStyle = '#8B7355';
    ctx.beginPath();
    ctx.moveTo(14, -2);
    ctx.lineTo(17, -1);
    ctx.lineTo(14, 0);
    ctx.closePath();
    ctx.fill();
    
    // ANIMATED WINGS - Gentle flapping
    const wingFlap = Math.sin(bird.wingPhase) * 5;
    
    // Left wing gentle flap
    ctx.fillStyle = '#C0C0C0';
    ctx.save();
    ctx.translate(-2, 0);
    ctx.rotate(wingFlap * 0.06);
    ctx.beginPath();
    ctx.ellipse(0, 0, 8, 5, 0, 0, Math.PI * 2);
    ctx.fill();
    // Wing pattern
    ctx.strokeStyle = '#A9A9A9';
    ctx.lineWidth = 0.8;
    for (let i = -6; i <= 0; i += 2) {
      ctx.beginPath();
      ctx.moveTo(i, -4);
      ctx.lineTo(i - 1.5, -5.5);
      ctx.stroke();
    }
    ctx.restore();
    
    // Right wing gentle flap
    ctx.fillStyle = '#C0C0C0';
    ctx.save();
    ctx.translate(2, 0);
    ctx.rotate(-wingFlap * 0.06);
    ctx.beginPath();
    ctx.ellipse(0, 0, 8, 5, 0, 0, Math.PI * 2);
    ctx.fill();
    // Wing pattern
    ctx.strokeStyle = '#A9A9A9';
    ctx.lineWidth = 0.8;
    for (let i = 0; i <= 6; i += 2) {
      ctx.beginPath();
      ctx.moveTo(i, -4);
      ctx.lineTo(i + 1.5, -5.5);
      ctx.stroke();
    }
    ctx.restore();
    
    // Elegant tail
    ctx.fillStyle = '#D3D3D3';
    ctx.beginPath();
    ctx.moveTo(-10, -1);
    ctx.lineTo(-14, -2);
    ctx.lineTo(-14, 2);
    ctx.lineTo(-10, 1);
    ctx.closePath();
    ctx.fill();
  }
  
  ctx.restore();
}

function draw() {
  const level = levels[game.level];
  ctx.fillStyle = level.bgColor; ctx.fillRect(0, 0, canvas.width, canvas.height);
  drawTheme();
  
  // Draw flying birds
  for (let bird of game.birds) {
    drawBird(bird);
  }
  
  for (let p of level.platforms) {
    if (p.collected && p !== level.platforms[0]) { ctx.fillStyle = 'rgba(139, 69, 19, 0.3)'; } else { ctx.fillStyle = '#228B22'; }
    ctx.fillRect(p.x, p.y, p.width, p.height);
    if (!p.collected || p === level.platforms[0]) { ctx.strokeStyle = '#1a5a1a'; ctx.lineWidth = 2; for (let j = 0; j < p.width; j += 30) { ctx.strokeRect(p.x + j, p.y, 28, p.height); } }
    ctx.fillStyle = 'rgba(255, 255, 255, 0.2)'; ctx.fillRect(p.x, p.y, p.width, 3);
  }
  for (let enemy of level.enemies) {
    if (enemy.type === 'monkey') { ctx.fillStyle = '#8B4513'; ctx.beginPath(); ctx.arc(enemy.x + 20, enemy.y + 15, 18, 0, Math.PI * 2); ctx.fill(); ctx.fillStyle = 'white'; ctx.beginPath(); ctx.arc(enemy.x + 20, enemy.y + 8, 8, 0, Math.PI * 2); ctx.fill(); ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(enemy.x + 17, enemy.y + 8, 3, 0, Math.PI * 2); ctx.fill(); ctx.beginPath(); ctx.arc(enemy.x + 23, enemy.y + 8, 3, 0, Math.PI * 2); ctx.fill(); }
    else if (enemy.type === 'snake') { ctx.fillStyle = '#9B6B3A'; ctx.beginPath(); ctx.ellipse(enemy.x + 25, enemy.y + 15, 25, 12, 0, 0, Math.PI * 2); ctx.fill(); ctx.fillStyle = '#FFD700'; for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.arc(enemy.x + 10 + i * 15, enemy.y + 15, 3, 0, Math.PI * 2); ctx.fill(); } }
    else if (enemy.type === 'crocodile') { ctx.fillStyle = '#2F4F2F'; ctx.fillRect(enemy.x, enemy.y, enemy.width, enemy.height); ctx.fillStyle = '#FFD700'; for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.arc(enemy.x + 10 + i * 15, enemy.y, 4, 0, Math.PI * 2); ctx.fill(); } }
  }
  ctx.save(); ctx.translate(level.goal.x + 30, level.goal.y + 30); ctx.rotate(game.time / 50); ctx.fillStyle = '#00BFFF'; ctx.shadowColor = '#00BFFF'; ctx.shadowBlur = 20; ctx.fillRect(-20, -20, 40, 40); ctx.strokeStyle = '#1E90FF'; ctx.lineWidth = 3; ctx.strokeRect(-20, -20, 40, 40); ctx.restore();
  ctx.shadowColor = game.player.color; ctx.shadowBlur = 15; drawShifty(game.player.x + game.player.width / 2, game.player.y + game.player.height / 2, game.player.color); ctx.shadowBlur = 0;
  for (let p of game.particles) { ctx.fillStyle = p.color; ctx.globalAlpha = p.life / 60; ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill(); } ctx.globalAlpha = 1;
}

function playJump() {
  initAudio();
  // Fun jump sound - quick chirp
  const osc = audioContext.createOscillator();
  const gain = audioContext.createGain();
  osc.connect(gain);
  gain.connect(audioContext.destination);
  
  osc.type = 'sine';
  osc.frequency.value = 600; // Bright jump sound
  
  gain.gain.setValueAtTime(0, audioContext.currentTime);
  gain.gain.linearRampToValueAtTime(0.3, audioContext.currentTime + 0.05);
  gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.2);
  
  osc.start(audioContext.currentTime);
  osc.stop(audioContext.currentTime + 0.2);
}

function playTransform() { initAudio(); const osc = audioContext.createOscillator(); const gain = audioContext.createGain(); osc.connect(gain); gain.connect(audioContext.destination); osc.frequency.setValueAtTime(600, audioContext.currentTime); osc.frequency.exponentialRampToValueAtTime(800, audioContext.currentTime + 0.2); gain.gain.setValueAtTime(0.2, audioContext.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.2); osc.start(audioContext.currentTime); osc.stop(audioContext.currentTime + 0.2); }

function playLoseLife() {
  initAudio();
  // Sad but not too harsh - descending beep
  const osc = audioContext.createOscillator();
  const gain = audioContext.createGain();
  osc.connect(gain);
  gain.connect(audioContext.destination);
  
  osc.type = 'sine';
  osc.frequency.setValueAtTime(400, audioContext.currentTime);
  osc.frequency.exponentialRampToValueAtTime(200, audioContext.currentTime + 0.3);
  
  gain.gain.setValueAtTime(0, audioContext.currentTime);
  gain.gain.linearRampToValueAtTime(0.2, audioContext.currentTime + 0.05);
  gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.25);
  
  osc.start(audioContext.currentTime);
  osc.stop(audioContext.currentTime + 0.3);
}

function playCrystal() {
  initAudio();
  // Exciting crystal/victory sound - ascending notes
  const notes = [800, 1000, 1200, 1400];
  notes.forEach((freq, i) => {
    setTimeout(() => {
      const osc = audioContext.createOscillator();
      const g = audioContext.createGain();
      osc.connect(g);
      g.connect(audioContext.destination);
      
      osc.type = 'sine';
      osc.frequency.value = freq;
      
      g.gain.setValueAtTime(0, audioContext.currentTime);
      g.gain.linearRampToValueAtTime(0.25, audioContext.currentTime + 0.05);
      g.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.3);
      
      osc.start(audioContext.currentTime);
      osc.stop(audioContext.currentTime + 0.3);
    }, i * 80);
  });
}

updateFormDisplay(); document.getElementById('level').textContent = '1'; updateLives(); loadLevel(0);

function gameLoop() { update(); draw(); requestAnimationFrame(gameLoop); }

gameLoop();
</script>
